complexity:
  active: true
  # Compose functions naturally have many parameters; we relax this for @Composable
  TooManyFunctions:
    active: true
    excludes: ['**/ui/**', '**/screens/**', '**/components/**', '**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**']
  LongParameterList:
    active: true
    # 2026 Meta: Compose slots often require 10+ params (modifier, colors, state, etc.)
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
    functionThreshold: 12
    constructorThreshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 15 # Strict for logic, but allows for complex UI state switching
  LongMethod:
    active: true
    threshold: 60 # Balanced for Compose and business logic
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**', '**/ui/root/**', '**/services/**', '**/desktopApp/src/main/kotlin/main.kt', '**/ui/game/DefaultGameComponent.kt']
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'

naming:
  active: true
  # Compose functions must start with uppercase, but Detekt expects lowercase by default
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '.*'
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
  TopLevelPropertyNaming:
    active: true
    # Allows for 'val _state = ...' pattern common in MVI/MVVM, and PascalCase for Compose constants
    constantPattern: '[A-Z][_a-zA-Z0-9]*|_?[a-z][a-zA-Z0-9]*'
  InvalidPackageDeclaration:
    active: true
    excludes: ['**/Benchmark.kt']

style:
  active: true
  # Allow "MagicNumbers" in Compose for things like Dp, Sp, and Color hex codes
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**', '**/ui/**', '**/*Screen.kt', '**/theme/**', '**/Benchmark.kt']
    ignoreEnums: true
    ignoreNumbers: ['-1', '0', '1', '2'] 
    ignorePropertyDeclaration: true 
    ignoreAnnotated: ['androidx.compose.runtime.Composable']
  UnnecessaryParentheses:
    active: true
    allowForUnclearPrecedence: true
  ReturnCount:
    active: true
    max: 2 # Relaxed slightly for guard clauses
    excludeGuardClauses: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**', '**/Benchmark.kt']
  UnusedPrivateProperty:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**', '**/Benchmark.kt']
  WildcardImport:
    active: true
    excludes: ['**/Benchmark.kt']

performance:
  active: true
  # Essential for 2026: Catches heavy operations inside Composable recompositions
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**', '**/Benchmark.kt']

exceptions:
  active: true
  SwallowedException:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/iosTest/**', '**/jvmTest/**']

# io.nlopez.compose.rules configuration
Compose:
  active: true
  ComposableNaming:
    active: true
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ViewModelForwarding:
    active: true
  # Using names from 0.5.6 standard
  ContentTrailingLambda:
    active: true
  MultipleEmitters:
    active: true
  MutableStateAutoboxing:
    active: true
  ModifierNaming:
    active: true
  ModifierWithoutDefault:
    active: true
